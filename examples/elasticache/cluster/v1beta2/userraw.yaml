apiVersion: elasticache.aws.upbound.io/v1beta2
kind: UserRAW
metadata:
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    accessString: "on ~app::* -@all +@read +@hash +@bitmap +@geo -SETBIT -BITFIELD -HSET -HSETNX -HMSET -HINCRBY -HINCRBYFLOAT -HDEL -BITOP -LMOVE -BLMOVE -RPOPLPUSH -BRPOPLPUSH -BLPOPLPUSH -LPUSH -LPUSHX -RPUSH -RPUSHX -LINSERT -LSET -LREM -LTRIM -ZINCRBY -ZINTERSTORE -ZUNIONSTORE -ZDIFFSTORE -ZADD -ZREM -ZRANGESTORE -GEOADD -GEORADIUS -GEORADIUSBYMEMBER +GET +MGET +SMEMBERS +SINTERCARD"
    engine: redis
    region: us-east-1
    userName: exampleuser
