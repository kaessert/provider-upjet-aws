apiVersion: elasticache.aws.m.upbound.io/v1beta1
kind: ParameterGroupRAW
metadata:
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: default
spec:
  forProvider:
    name: cache-params
    family: redis2.8
    parameter:
      - name: activerehashing
        value: "yes"
      - name: min-slaves-to-write
        value: "2"
    region: us-west-1
