# Dead-letter queue — must exist before the redrive policy can reference it.
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRAW
metadata:
  name: example-dlq
  labels:
    testing.upbound.io/example-name: example-dlq
spec:
  forProvider:
    name: example-dlq
    region: us-west-1

---
# Source queue — the queue on which the redrive policy is set.
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRAW
metadata:
  name: example
  labels:
    testing.upbound.io/example-name: example
spec:
  forProvider:
    name: queueredrivepolicy-src
    region: us-west-1

---
# Redrive policy — attaches to the source queue and routes failed messages to the DLQ.
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRedrivePolicyRAW
metadata:
  name: queueredrivepolicy-raw
  labels:
    testing.upbound.io/example-name: queueredrivepolicy-raw
spec:
  forProvider:
    region: us-west-1
    queueUrlRef:
      name: example
    redrivePolicy: |
      {
        "deadLetterTargetArn": "arn:aws:sqs:us-west-1:609897127049:example-dlq",
        "maxReceiveCount": 4
      }

