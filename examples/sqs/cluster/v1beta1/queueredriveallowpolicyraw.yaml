# Dead-letter queue — the queue on which the redrive allow policy is set.
# This controls which source queues are permitted to use this queue as their DLQ.
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRAW
metadata:
  name: example
  labels:
    testing.upbound.io/example-name: example
spec:
  forProvider:
    name: upbound-qrap-dlq
    region: us-west-1

---
# Redrive allow policy — sets which source queues may use the above queue as their DLQ.
# Uses redrivePermission: allowAll so no hardcoded source ARNs are required.
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRedriveAllowPolicyRAW
metadata:
  name: queueredriveallowpolicy-raw
  labels:
    testing.upbound.io/example-name: queueredriveallowpolicy-raw
spec:
  forProvider:
    region: us-west-1
    queueUrlRef:
      name: example
    redriveAllowPolicy: |
      {"redrivePermission": "allowAll"}

