apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueuePolicyRAW
metadata:
  name: queue-policy
  annotations:
    meta.upbound.io/example-id: sqs/v1beta1/queue-policyraw
  labels:
    testing.upbound.io/example-name: queue-policy
spec:
  forProvider:
    region: us-west-1
    queueUrlSelector:
      matchLabels:
        testing.upbound.io/example-name: queue-policy
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "example",
            "Effect": "Allow",
            "Principal": {
              "Service": "s3.amazonaws.com"
            },
            "Action": "sqs:SendMessage",
            "Resource": "arn:aws:sqs:us-west-1:*:queue-policy"
          }
        ]
      }

---
apiVersion: sqs.aws.upbound.io/v1beta1
kind: QueueRAW
metadata:
  name: queue-policy
  annotations:
    meta.upbound.io/example-id: sqs/v1beta1/queuepolicyraw
  labels:
    testing.upbound.io/example-name: queue-policy
spec:
  forProvider:
    region: us-west-1
    name: queue-policy
