apiVersion: sqs.aws.m.upbound.io/v1beta1
kind: QueueRedriveAllowPolicyRAW
metadata:
  name: queueredriveallowpolicy-raw
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: queueredriveallowpolicy-raw
spec:
  forProvider:
    region: us-west-1
    queueUrlRef:
      name: example
    redriveAllowPolicy: |
      {
        "redrivePermission": "byQueue",
        "sourceQueueArns": ["arn:aws:sqs:us-west-1:609897127049:srcqueue"]
      }

