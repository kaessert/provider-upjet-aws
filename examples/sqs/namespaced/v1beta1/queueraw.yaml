apiVersion: sqs.aws.m.upbound.io/v1beta1
kind: QueueRAW
metadata:
  name: example
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: example
spec:
  forProvider:
    name: upbound-sqs-raw
    delaySeconds: 90
    maxMessageSize: 2048
    messageRetentionSeconds: 86400
    receiveWaitTimeSeconds: 10
    region: us-west-1
    tags:
      Environment: production
  providerConfigRef:
    name: default
