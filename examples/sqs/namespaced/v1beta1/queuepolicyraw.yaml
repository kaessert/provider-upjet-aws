apiVersion: sqs.aws.m.upbound.io/v1beta1
kind: QueuePolicyRAW
metadata:
  name: queue-policy-raw
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: queue-policy-raw
spec:
  forProvider:
    region: us-west-1
    queueUrlRef:
      name: example
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "example",
            "Effect": "Allow",
            "Principal": {
              "Service": "s3.amazonaws.com"
            },
            "Action": "sqs:SendMessage",
            "Resource": "arn:aws:sqs:us-west-1:609897127049:upbound-sqs-raw"
          }
        ]
      }

