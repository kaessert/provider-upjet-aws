apiVersion: sqs.aws.m.upbound.io/v1beta1
kind: QueueRedrivePolicyRAW
metadata:
  name: queueredrivepolicy-raw
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: queueredrivepolicy-raw
spec:
  forProvider:
    region: us-west-1
    queueUrlRef:
      name: example
    redrivePolicy: |
      {
        "deadLetterTargetArn": "arn:aws:sqs:us-west-1:609897127049:example-dlq",
        "maxReceiveCount": 4
      }
  providerConfigRef:
    name: default
