apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: SecretPolicyRAW
metadata:
  labels:
    testing.upbound.io/example-name: secretsmanager
  name: example
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "EnableAnotherAWSAccountToReadTheSecret",
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::609897127049:root"
            },
            "Action": "secretsmanager:GetSecretValue",
            "Resource": "*"
          }
        ]
      }
    region: us-west-1
    secretArnSelector:
      matchLabels:
        testing.upbound.io/example-name: secretsmanager
