apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: SecretRotationRAW
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    region: us-east-1
    rotationLambdaArnSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw
    rotationRules:
    - automaticallyAfterDays: 30
    secretIdSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw

---

apiVersion: lambda.aws.upbound.io/v1beta1
kind: Permission
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    region: us-east-1
    action: lambda:InvokeFunction
    principal: secretsmanager.amazonaws.com
    statementId: AllowExecutionFromSecretsManager
    functionNameSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw

---

apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: SecretRAW
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    name: example-${Rand.RFC1123Subdomain}
    region: us-east-1

---

apiVersion: lambda.aws.upbound.io/v1beta1
kind: Function
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    region: us-east-1
    environment:
    - variables:
        foo: bar
    s3BucketSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw
    s3Key: lambda.zip
    handler: handler
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw
    runtime: nodejs18.x

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: sample-role
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Action": "sts:AssumeRole",
            "Principal": {
              "Service": "lambda.amazonaws.com"
            },
            "Effect": "Allow",
            "Sid": ""
          }
        ]
      }

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
    crossplane.io/external-name: ${Rand.RFC1123Subdomain}
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    region: us-east-1

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: Object
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretrotationraw
    uptest.upbound.io/disable-import: "true"
  labels:
    testing.upbound.io/example-name: secretrotationraw
  name: example-secretrotationraw
spec:
  forProvider:
    region: us-east-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: secretrotationraw
    # A zip file for a "hello world" javascript lambda
    contentBase64: UEsDBBQAAAAIAFd7c1eDOfFtMAAAADEAAAAIABwAaW5kZXguanNVVAkAA7WZWmWrmVpldXgLAAEE6AMAAAToAwAAS60oyC8qKdbLSMxLyUktUrBV0NBUsLVTSM7PK87PSdXLyU/XUPfLB/FLUvNK1DUBUEsBAh4DFAAAAAgAV3tzV4M58W0wAAAAMQAAAAgAGAAAAAAAAQAAALSBAAAAAGluZGV4LmpzVVQFAAO1mVpldXgLAAEE6AMAAAToAwAAUEsFBgAAAAABAAEATgAAAHIAAAAAAA==
    contentType: application/zip
    key: lambda.zip
