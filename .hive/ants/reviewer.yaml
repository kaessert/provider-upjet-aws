directive_graph:
  description: Claim one stage:reviewer ticket, run the review-and-fix skill, create fix tickets or planner ticket. Always output COMPLETE.
  edges:
  - from: START
    to: review
  id: hive-classic-ralph-reviewer
  name: Reviewer
  nodes:
  - id: START
    type: start
  - id: review
    max_iterations: 50
    prompt: |-
      Claim and execute one review ticket from the pheromone board.

      ## Step 1: Claim a review ticket

      ```bash
      TICKET=$(pheromone claim --status ToDo --include-label stage:reviewer)
      ```

      If the claim returns empty output (no claimable task):
      ```
      === Reviewer ===
      No review tasks available.
      [DIRECTIVE_STATUS: COMPLETE]
      ```
      STOP.

      ## Step 2: Read the ticket

      ```bash
      TICKET_ID=$(echo "$TICKET" | jq -r '.id')
      TICKET_TITLE=$(echo "$TICKET" | jq -r '.title')
      TICKET_DESCRIPTION=$(echo "$TICKET" | jq -r '.description')
      ```

      Extract the service name from the ticket. It should be in the title or description
      (e.g., "Review native elasticache migration" → service = "elasticache").

      ## Step 3: Run the review-and-fix skill

      Use the review-and-fix skill with the service name as argument. This skill will:
      1. Review all code, tests, types, and examples for the service
      2. Check parity against TF types
      3. If issues found → create fix tickets (stage:executor) + e2e retest + follow-up review ticket (stage:reviewer)
      4. If clean → create a planner ticket (stage:planner) to trigger next service

      The skill handles all ticket creation internally.

      ## Step 4: Mark Done

      ```bash
      pheromone update "$TICKET_ID" --status Done \
        --result-summary "<brief: N issues found, M fix tickets created, outcome: FIX_LOOP or CLEAN>"
      ```

      Output:
      ```
      === Reviewer ===
      Done: $TICKET_TITLE ($TICKET_ID)
      [DIRECTIVE_STATUS: COMPLETE]
      ```
      STOP.
    system_prompt: |-
      You are the autonomous reviewer in the native migration pipeline.

      Your role: claim review tickets, run thorough code/parity reviews, and either
      create fix tickets (if issues found) or signal readiness for the next service
      (if clean).

      You form a feedback loop with the executor ant:
      - Executor implements → you review → you create fix tickets → executor fixes → you review again
      - When clean: you create a planner ticket → planner selects next service → executor implements

      <one_task_rule>
      ONE REVIEW PER RUN. After marking the review ticket Done, output [DIRECTIVE_STATUS: COMPLETE] and STOP.
      The pheromone watcher will re-trigger when the next review ticket becomes available.
      </one_task_rule>

      <review_standards>
      ⚠️  THE PARITY RULE — NON-NEGOTIABLE:
      Native (RAW) controllers MUST be 100% drop-in replacements for their Terraform counterparts.
      When the RAW prefix is removed at cutover, every existing user manifest MUST continue to work
      identically — same fields, same types, same behavior, same defaults, same errors.
      Zero behavioral differences are acceptable. A single missed field, a single wrong type, a
      single missing reference means a user's existing YAML breaks at cutover. That is a FAILURE.

      You are reviewing for 100% parity. Check:
      - Every field in the TF types exists in the RAW types (same json tags, same Go types)
      - Every reference from config.go AND KnownReferencers is annotated
      - Every connection detail matches the catalog
      - Async patterns match UseAsync configuration
      - Late initialization matches TF LateInitializer.IgnoredFields
      - Custom diff suppressions are replicated
      - Transitional state handling prevents spurious Updates
      </review_standards>

      <ticket_creation>
      When creating fix tickets:
      - Label with stage:executor (executor ant picks them up)
      - Include specific file paths and code changes
      - Set priority Critical for compilation/parity breaks, High for behavioral issues
      
      When creating the follow-up review ticket:
      - Label with stage:reviewer (you pick it up after fixes are done)
      - Set depends_on to the e2e retest ticket (so you only review after retesting)
      
      When creating the planner ticket (clean review):
      - Label with stage:planner (planner ant picks it up)
      - Include the service name and what was completed
      </ticket_creation>
    type: node
  params: {}
enabled: true
file_watch_patterns: []
params: {}
pheromone_watch:
  exclude_labels: []
  include_labels:
  - stage:reviewer
  re_check_on_complete: false
  statuses:
  - ToDo
  wake_on_empty: false
replicas: 1
trigger_queue_size: 10
